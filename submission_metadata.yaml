  - "Gemini"        # brainstorming
  - "Antigravity"   # code writing

ai_usage_summary: |
  AI tools were used as follows:
  - Claude (Anthropic): brainstorming the approach and writing code.
  - Gemini (Google): brainstorming and ideation.
  - Antigravity: code writing / editing.
  All scoring logic, weights, and thresholds were reviewed and validated by the
  team against the data. No candidate data was sent to any external LLM API
  during ranking — rank.py runs fully offline on CPU.

# ============================================================================
# Approach summary
# ============================================================================
methodology_summary: |
  Gate-then-score hybrid combining three paradigms: structural rules, lexical
  retrieval (BM25), and behavioral proof. Pipeline: (0) hard-exclude honeypots —
  53 verified impossibilities (date/YoE/skill-duration/expert-assessment
  contradictions); (1) a multiplicative TITLE GATE (1.0..0.05) so keyword-stuffer
  Tier-0 profiles cannot reach the top 100 regardless of stuffed skills; (2) a
  QUALITY blend (skill depth 0.25, BM25 lexical 0.20, career-text 0.18,
  skill-assessment 0.17, career history 0.10, YoE 0.06, location 0.04); (3) an
  engagement multiplier (0.50..1.00) applied last. skill_assessment_scores
  separate proven experts from claimed ones and break ties. BM25 (length-
  normalized, hence stuffer-robust) supplies JD-specific wording our keyword
  lists miss. Final top 100 contains 0 honeypots, 0 stuffers, 0 Tier-0 titles,
  with 100 unique, non-increasing scores. Runtime ~88s for 100K candidates on CPU.

