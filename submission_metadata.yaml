# ============================================================================
# Solution Overview
# ============================================================================
problem_statement: "Candidate Ranking for Senior AI Engineer Role"

solution_name: "Hybrid RAG: Gate-Then-Score Pipeline"

methodology_summary: |
  A Gate-Then-Score hybrid pipeline combining structural rules, dual retrieval
  (BM25 + TF-IDF), and behavioral signals.

  Stage 0 — HONEYPOT DETECTION (Hard Exclusion):
    4-check validation system identifies 53 impossible profiles:
    (1) Date logic violations (career_start > today, end < start)
    (2) YoE duration mismatch (sum of job durations != declared YoE)
    (3) Skill duration anomaly (4+ Expert skills with 0 months duration)
    (4) Assessment impossibility (Expert skill with assessment score < 40)
    Action: score = 0, excluded before ranking.

  Stage 1 — DUAL RETRIEVAL (BM25 + TF-IDF):
    BM25 lexical retrieval: top 3,000 by keyword match (length-normalized,
    stuffer-resistant). TF-IDF semantic retrieval: top 3,000 by concept match.
    Union: ~3,700 candidates. Hard-filter TIER0 titles (2,653) and remaining
    honeypots (5). Result: ~1,045 clean candidates for scoring.

  Stage 2 — QUALITY BLEND (7 Components):
    skill_depth (0.25) + bm25_score (0.20) + career_text_relevance (0.18)
    + assessment_score (0.17) + career_progression (0.10)
    + yoe_score (0.06) + location_score (0.04)

  Stage 3 — RANKING GATES (Multiplicative):
    Title gate: Senior=1.0x, Mid=0.5x, TIER0=0.05x (prevents stuffer gaming).
    Engagement multiplier: 0.50x–1.00x (notice period, activity, recency).

  Final Score = Title_Gate × Quality_Blend × Engagement

  Result: Top 100 contains 0 honeypots, 0 keyword stuffers, 0 TIER0 titles.
  All 100 scores unique and non-increasing. Runtime ~88s on CPU.

