[theme]
primaryColor = "#0078D4"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

[client]
showErrorDetails = true
toolbarMode = "viewer"
maxUploadSize = 500

[logger]
level = "info"

[browser]
gatherUsageStats = false

[server]
maxUploadSize = 500
enableXsrfProtection = true
